<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arogga Lost & Damage Panel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    
    <!-- App Container -->
    <div id="root"></div>

    <script>
        // ==========================================
        // STATE & GLOBAL VARIABLES
        // ==========================================
        const getDhakaDate = () => {
            const d = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Dhaka"}));
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        let activeCourier = null;
        let date = getDhakaDate();
        let records = [];
        let showDeleteAllConfirm = false;

        const couriers = [
            { name: 'Paperfly', color: 'bg-blue-600', hover: 'hover:bg-blue-700', disabled: false },
            { name: 'Steadfast', color: 'bg-green-600', hover: 'hover:bg-green-700', disabled: false },
            { name: 'Pathao', color: 'bg-red-600', hover: 'hover:bg-red-700', disabled: false },
            { name: 'Redx', color: 'bg-orange-600', hover: 'hover:bg-orange-700', disabled: false },
            { name: 'Arogga', color: 'bg-teal-600', hover: 'hover:bg-teal-700', disabled: true }
        ];

        // ==========================================
        // UTILITY FUNCTIONS
        // ==========================================
        const escapeHtml = (unsafe) => {
            if (typeof unsafe !== 'string') return unsafe;
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        };

        const generateUUID = () => {
            if (crypto && crypto.randomUUID) return crypto.randomUUID();
            return '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, c =>
                (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
            );
        };

        const getPlaceholder = (courier) => {
            switch(courier) {
                case 'Steadfast': return 'e.g. SFR260513STB9DB73CBD';
                case 'Pathao': return 'e.g. DA120526EBY9BZ';
                case 'Redx': return 'e.g. 26A513WE1CR1BJ';
                default: return 'e.g. 050526-934340-A4-G4';
            }
        };

        const formatQuantity = (qty) => {
            if (!qty) return '0';
            return qty.split(/([\s-]+)/).map(part => {
                if (/^[a-zA-Z]+$/.test(part)) {
                    return part.charAt(0).toUpperCase() + part.slice(1).toLowerCase();
                }
                return part;
            }).join('');
        };

        // ==========================================
        // DATA MANAGEMENT
        // ==========================================
        const saveToLocalStorage = () => {
            if (activeCourier) {
                localStorage.setItem(`arogga_data_${activeCourier}`, JSON.stringify(records));
            }
        };

        const updateCountersUI = () => {
            if(!activeCourier) return;
            const totalParcels = records.length;
            const productCount = records.reduce((acc, rec) => acc + rec.products.length, 0);
            const damagedCount = records.reduce((acc, rec) => acc + rec.products.filter(p => p.status === 'Damaged').length, 0);
            const lostCount = records.reduce((acc, rec) => acc + rec.products.filter(p => p.status === 'Lost').length, 0);
            const hasSavedRecords = records.some(r => r.mode === 'view');

            document.querySelectorAll('.counter-tp').forEach(el => el.innerText = totalParcels);
            document.querySelectorAll('.counter-pc').forEach(el => el.innerText = productCount);
            document.querySelectorAll('.counter-dc').forEach(el => el.innerText = damagedCount);
            document.querySelectorAll('.counter-lc').forEach(el => el.innerText = lostCount);

            document.querySelectorAll('.export-btn').forEach(btn => btn.disabled = !hasSavedRecords);
            document.querySelectorAll('.delete-all-btn').forEach(btn => btn.disabled = records.length === 0);
        };

        const handleSaveRecord = (record) => {
            if (record.noRequired) {
                record.mode = 'view';
                record.errors = {};
                saveToLocalStorage();
                render();
                return;
            }

            let newErrors = {};
            let hasError = false;

            if (!record.consignmentId.trim()) { 
                newErrors.consignmentId = 'Consignment ID is required.'; 
                hasError = true; 
            }
            if (!record.aroggaId.trim()) { 
                newErrors.aroggaId = 'Arogga ID is required.'; 
                hasError = true; 
            } else if (!/[a-zA-Z]/.test(record.aroggaId)) { 
                newErrors.aroggaId = 'Maybe you forgot to add id with letter A or B or Others.'; 
                hasError = true; 
            }
            if (!record.videoLink.trim()) { 
                newErrors.videoLink = 'Video link is required.'; 
                hasError = true; 
            }

            let productErrors = {};
            record.products.forEach(p => {
                let pErr = {};
                if (!p.name.trim()) pErr.name = 'Required';
                if (!p.qty.trim()) {
                    pErr.qty = 'Required';
                } else if (!p.qty.includes('-')) {
                    pErr.qty = 'Maybe you forgot to give ("-" the icon) here.';
                }
                if (!p.status) pErr.status = 'Required';

                if (Object.keys(pErr).length > 0) {
                    productErrors[p.id] = pErr;
                    hasError = true;
                }
            });
            
            newErrors.products = productErrors;

            if (hasError) {
                record.errors = newErrors;
            } else {
                record.errors = {};
                record.mode = 'view';
            }
            
            saveToLocalStorage();
            render();
        };

        // ==========================================
        // EVENT LISTENERS (Delegation)
        // ==========================================
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;

            const action = btn.dataset.action;
            const id = btn.dataset.id;
            const pid = btn.dataset.pid;

            if (action === 'select-courier') {
                if (btn.dataset.disabled === "true") return;
                activeCourier = btn.dataset.courier;
                const savedData = localStorage.getItem(`arogga_data_${activeCourier}`);
                records = savedData ? JSON.parse(savedData) : [];
                render();
            } 
            else if (action === 'back-home') {
                activeCourier = null;
                render();
            }
            else if (action === 'add-record') {
                records.push({
                    id: generateUUID(),
                    consignmentId: '', aroggaId: '',
                    products: [{ id: generateUUID(), name: '', qty: '', status: '' }],
                    videoLink: '', mode: 'edit', noRequired: false, confirmDelete: false, errors: {}
                });
                saveToLocalStorage();
                render();
            }
            else if (action === 'add-product') {
                const record = records.find(r => r.id === id);
                if(record) {
                    record.products.push({ id: generateUUID(), name: '', qty: '', status: '' });
                    saveToLocalStorage();
                    render();
                }
            }
            else if (action === 'remove-product') {
                const record = records.find(r => r.id === id);
                if(record) {
                    record.products = record.products.filter(p => p.id !== pid);
                    saveToLocalStorage();
                    render();
                }
            }
            else if (action === 'delete-record') {
                records = records.filter(r => r.id !== id);
                saveToLocalStorage();
                render();
            }
            else if (action === 'prompt-delete-record') {
                const record = records.find(r => r.id === id);
                if(record) {
                    record.confirmDelete = true;
                    render();
                }
            }
            else if (action === 'cancel-delete-record') {
                const record = records.find(r => r.id === id);
                if(record) {
                    record.confirmDelete = false;
                    render();
                }
            }
            else if (action === 'save-record') {
                const record = records.find(r => r.id === id);
                if(record) handleSaveRecord(record);
            }
            else if (action === 'edit-record') {
                const record = records.find(r => r.id === id);
                if(record) {
                    record.mode = 'edit';
                    saveToLocalStorage();
                    render();
                }
            }
            else if (action === 'show-delete-all') {
                showDeleteAllConfirm = true;
                render();
            }
            else if (action === 'cancel-delete-all') {
                showDeleteAllConfirm = false;
                render();
            }
            else if (action === 'confirm-delete-all') {
                records = [];
                showDeleteAllConfirm = false;
                saveToLocalStorage();
                render();
            }
            else if (action === 'export-docx') {
                exportToWord();
            }
        });

        // Real-time input handling (Updates state without full DOM re-render to preserve focus)
        document.addEventListener('input', (e) => {
            const target = e.target;
            
            if (target.dataset.action === 'update-date') {
                date = target.value;
            }
            else if (target.dataset.action === 'update-record') {
                const id = target.dataset.id;
                const field = target.dataset.field;
                let val = target.type === 'checkbox' ? target.checked : target.value;
                
                if (field === 'aroggaId') {
                    val = val.toUpperCase();
                    target.value = val;
                }

                const record = records.find(r => r.id === id);
                if (record) {
                    record[field] = val;
                    // Clear local error & update specific DOM classes
                    if (record.errors && record.errors[field]) {
                        delete record.errors[field];
                        target.classList.remove('border-red-400', 'focus:ring-red-500');
                        target.classList.add('border-slate-300', 'focus:ring-teal-500');
                        const errEl = document.getElementById(`err-${id}-${field}`);
                        if(errEl) errEl.style.display = 'none';
                    }
                    saveToLocalStorage();
                    updateCountersUI();
                }
            }
            else if (target.dataset.action === 'update-product') {
                const id = target.dataset.id;
                const pid = target.dataset.pid;
                const field = target.dataset.field;
                const val = target.value;

                const record = records.find(r => r.id === id);
                if (record) {
                    const product = record.products.find(p => p.id === pid);
                    if (product) {
                        product[field] = val;
                        if (record.errors?.products?.[pid]?.[field]) {
                            delete record.errors.products[pid][field];
                            target.classList.remove('border-red-400', 'focus:ring-red-500');
                            target.classList.add('border-slate-300', 'focus:ring-teal-500');
                            const errEl = document.getElementById(`err-${id}-${pid}-${field}`);
                            if(errEl) errEl.style.display = 'none';
                        }
                        saveToLocalStorage();
                        updateCountersUI();
                    }
                }
            }
        });

        // ==========================================
        // DOCX EXPORT LOGIC
        // ==========================================
        const exportToWord = () => {
            const savedRecords = records.filter(r => r.mode === 'view');
            if (savedRecords.length === 0) return;

            const parts = date.split('-');
            const formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;

            const docxBodyCSS = `
                @page Section1 {
                    size: 8.5in 11.0in;
                    margin: 1.0in 1.0in 1.0in 1.0in;
                    mso-header-margin: 0.5in;
                    mso-footer-margin: 0.5in;
                    mso-header: h1;
                    mso-footer: f1;
                }
                div.Section1 { page: Section1; }
                p.BodyDataRow { margin: 0 0 8pt 0; font-family: 'Calibri', sans-serif; font-size: 11pt; line-height: 1.15; }
                span.BodyDataBold { font-weight: bold; font-family: 'Calibri', sans-serif; }
                table.BodyDataTable { width: 100%; border: 0; border-collapse: collapse; page-break-inside: avoid; }
                a.BodyDataLink { color: #0563C1; text-decoration: underline; font-family: 'Calibri', sans-serif; }
            `;

            const docxHeaderFooterCSS = `
                p.HeaderStyleItem { text-align: center; margin: 0 0 8pt 0; line-height: 1.15; font-size: 16pt; font-family: 'Calibri', sans-serif; font-weight: normal; }
                p.FooterStyleItem { text-align: center; margin: 0 0 8pt 0; line-height: 1.15; font-size: 11pt; font-family: 'Calibri', sans-serif; font-weight: normal; }
                table.FooterTableStyle { width: 100%; border: 0; border-collapse: collapse; }
                td.FooterCellCenter { text-align: center; width: 50%; vertical-align: bottom; }
            `;

            let docxBodyHTML = '<p class="BodyDataRow">&nbsp;</p>\n';
            
            savedRecords.forEach((rec, index) => {
                const productsText = rec.products.map(p => 
                    `${escapeHtml(p.name)} [${escapeHtml(formatQuantity(p.qty))}] <span class="BodyDataBold">${escapeHtml(p.status || 'N/A')}</span>`
                ).join(' <span class="BodyDataBold">|</span> ');

                docxBodyHTML += `
                    <table class="BodyDataTable">
                        <tr>
                            <td>
                                <p class="BodyDataRow">Consignment ID : <span class="BodyDataBold">${escapeHtml(rec.consignmentId)}</span></p>
                                <p class="BodyDataRow">Arogga ID : <span class="BodyDataBold">${escapeHtml(rec.aroggaId)}</span></p>
                                <p class="BodyDataRow">Returned For : ${productsText}</p>
                                <p class="BodyDataRow">Video: <a class="BodyDataLink" href="${escapeHtml(rec.videoLink)}">${escapeHtml(rec.videoLink)}</a></p>
                            </td>
                        </tr>
                    </table>
                `;

                if ((index + 1) % 4 === 0 && index !== savedRecords.length - 1) {
                    docxBodyHTML += `<br clear="all" style="page-break-before:always; mso-break-type:page-break;" />\n`;
                    docxBodyHTML += `<p class="BodyDataRow">&nbsp;</p>\n`;
                } else if (index !== savedRecords.length - 1) {
                    docxBodyHTML += `<p class="BodyDataRow">&nbsp;</p>\n<p class="BodyDataRow">&nbsp;</p>\n`;
                }
            });

            const docxHeaderFooterHTML = `
                <!-- EXACT Match to CSS 'h1' and 'f1' tells Word to REMOVE these from the body -->
                <div style="mso-element:header" id="h1">
                    <p class="HeaderStyleItem">${escapeHtml(activeCourier)} Lost &amp; Damaged</p>
                    <p class="HeaderStyleItem">${escapeHtml(formattedDate)}</p>
                </div>
                <div style="mso-element:footer" id="f1">
                    <table class="FooterTableStyle">
                        <tr>
                            <td class="FooterCellCenter">
                                <p class="FooterStyleItem">
                                    ...................................................<br/>
                                    ${escapeHtml(activeCourier)} Agent
                                </p>
                            </td>
                            <td class="FooterCellCenter">
                                <p class="FooterStyleItem">
                                    ...................................................<br/>
                                    Arogga Agent
                                </p>
                            </td>
                        </tr>
                    </table>
                </div>
            `;

            const finalHtml = `
                <html xmlns:v="urn:schemas-microsoft-com:vml"
                      xmlns:o="urn:schemas-microsoft-com:office:office"
                      xmlns:w="urn:schemas-microsoft-com:office:word"
                      xmlns="http://www.w3.org/TR/REC-html40">
                <head>
                    <meta charset="utf-8">
                    <title>Export</title>
                    <!--[if gte mso 9]>
                    <xml>
                        <w:WordDocument>
                            <w:View>Print</w:View>
                            <w:Zoom>100</w:Zoom>
                            <w:DoNotOptimizeForBrowser/>
                        </w:WordDocument>
                    </xml>
                    <![endif]-->
                    <style>
                        ${docxBodyCSS}
                        ${docxHeaderFooterCSS}
                    </style>
                </head>
                <body>
                    <div class="Section1">
                        ${docxBodyHTML}
                        ${docxHeaderFooterHTML}
                    </div>
                </body>
                </html>
            `;

            const blob = new Blob(['\ufeff', finalHtml], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const downloadLink = document.createElement("a");
            downloadLink.href = url;
            downloadLink.download = `${activeCourier}_Lost_Damaged_${date}.doc`;
            
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            URL.revokeObjectURL(url);
        };

        // ==========================================
        // RENDERING
        // ==========================================
        const renderHome = () => {
            const couriersHTML = couriers.map(c => `
                <button
                    data-action="select-courier"
                    data-courier="${c.name}"
                    data-disabled="${c.disabled}"
                    class="relative flex flex-col items-center justify-center p-8 rounded-xl text-white shadow-lg transition-all duration-300 ${
                        c.disabled ? 'bg-slate-300 cursor-not-allowed opacity-80' : `${c.color} ${c.hover} hover:-translate-y-1 hover:shadow-xl cursor-pointer`
                    }"
                >
                    <i data-lucide="file-text" class="w-12 h-12 mb-4 opacity-80"></i>
                    <span class="text-2xl font-bold tracking-wide">${c.name}</span>
                    
                    ${c.disabled ? `
                        <div class="absolute inset-0 flex flex-col items-center justify-center bg-slate-800/60 rounded-xl backdrop-blur-[1px]">
                            <i data-lucide="lock" class="w-8 h-8 mb-2"></i>
                            <span class="font-semibold text-lg tracking-widest uppercase">Coming Soon</span>
                        </div>
                    ` : ''}
                </button>
            `).join('');

            return `
                <div class="min-h-screen bg-slate-50 p-8 text-slate-800 font-sans">
                    <div class="max-w-4xl mx-auto">
                        <div class="text-center mb-12">
                            <h1 class="text-4xl font-bold text-slate-900 flex justify-center items-center gap-3">
                                <i data-lucide="box" class="w-10 h-10 text-teal-600"></i>
                                Arogga Lost & Damage Panel
                            </h1>
                            <p class="text-slate-500 mt-2">Select a courier service to manage consignments</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${couriersHTML}
                        </div>
                    </div>
                </div>
            `;
        };

        const renderWorkspace = () => {
            const totalParcels = records.length;
            const productCount = records.reduce((acc, rec) => acc + rec.products.length, 0);
            const damagedCount = records.reduce((acc, rec) => acc + rec.products.filter(p => p.status === 'Damaged').length, 0);
            const lostCount = records.reduce((acc, rec) => acc + rec.products.filter(p => p.status === 'Lost').length, 0);
            const hasSavedRecords = records.some(r => r.mode === 'view');

            const noRecordsHTML = `
                <div class="text-center text-slate-400 py-20 flex flex-col items-center">
                    <i data-lucide="file-text" class="w-16 h-16 mb-4 opacity-20"></i>
                    <p class="text-lg">No records added yet.</p>
                </div>
            `;

            const recordsHTML = records.map(record => {
                if (record.mode === 'edit') {
                    const productsHTML = record.products.map(prod => `
                        <div class="flex flex-col md:flex-row gap-3 items-start bg-slate-50 p-3 rounded border border-slate-100">
                            <div class="flex-grow flex flex-col w-full md:w-auto">
                                <input 
                                    type="text" placeholder="Product Name"
                                    data-action="update-product" data-id="${record.id}" data-pid="${prod.id}" data-field="name"
                                    value="${escapeHtml(prod.name)}"
                                    class="w-full border rounded px-3 py-2 focus:ring-2 focus:outline-none ${record.errors?.products?.[prod.id]?.name ? 'border-red-400 focus:ring-red-500' : 'border-slate-300 focus:ring-teal-500'}"
                                />
                                <p id="err-${record.id}-${prod.id}-name" class="text-red-500 text-[11px] mt-1 font-medium" style="display:${record.errors?.products?.[prod.id]?.name ? 'block' : 'none'}">${escapeHtml(record.errors?.products?.[prod.id]?.name || '')}</p>
                            </div>
                            <div class="flex w-full md:w-auto gap-3 items-start">
                                <div class="w-1/2 md:w-32 flex flex-col">
                                    <div class="relative w-full">
                                        <input 
                                            type="text" placeholder="1-Strip"
                                            data-action="update-product" data-id="${record.id}" data-pid="${prod.id}" data-field="qty"
                                            value="${escapeHtml(prod.qty)}"
                                            class="w-full border rounded px-3 py-2 pl-6 pr-6 text-center focus:ring-2 focus:outline-none ${record.errors?.products?.[prod.id]?.qty ? 'border-red-400 focus:ring-red-500' : 'border-slate-300 focus:ring-teal-500'}"
                                        />
                                        <span class="absolute left-2 top-2 text-slate-400 font-bold">[</span>
                                        <span class="absolute right-2 top-2 text-slate-400 font-bold">]</span>
                                    </div>
                                    <span id="err-${record.id}-${prod.id}-qty" class="text-red-500 text-[11px] leading-tight mt-1 font-medium" style="display:${record.errors?.products?.[prod.id]?.qty ? 'block' : 'none'}">${escapeHtml(record.errors?.products?.[prod.id]?.qty || '')}</span>
                                </div>
                                <div class="w-1/2 md:w-32 flex flex-col">
                                    <select 
                                        data-action="update-product" data-id="${record.id}" data-pid="${prod.id}" data-field="status"
                                        class="w-full border rounded px-3 py-2 bg-white focus:ring-2 focus:outline-none ${record.errors?.products?.[prod.id]?.status ? 'border-red-400 focus:ring-red-500' : 'border-slate-300 focus:ring-teal-500'}"
                                    >
                                        <option value="" ${prod.status==='' ? 'selected' : ''} disabled>Select</option>
                                        <option value="Damaged" ${prod.status==='Damaged' ? 'selected' : ''}>Damaged</option>
                                        <option value="Lost" ${prod.status==='Lost' ? 'selected' : ''}>Lost</option>
                                    </select>
                                    <p id="err-${record.id}-${prod.id}-status" class="text-red-500 text-[11px] mt-1 font-medium" style="display:${record.errors?.products?.[prod.id]?.status ? 'block' : 'none'}">${escapeHtml(record.errors?.products?.[prod.id]?.status || '')}</p>
                                </div>
                                ${record.products.length > 1 ? `
                                    <button data-action="remove-product" data-id="${record.id}" data-pid="${prod.id}" class="text-red-400 hover:text-red-600 p-2 mt-1" title="Remove Product">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    `).join('');

                    return `
                        <div class="relative mb-6">
                            <div class="bg-white border border-teal-200 rounded-lg p-5 shadow-sm ring-1 ring-teal-50">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Consignment ID</label>
                                        <input type="text" data-action="update-record" data-id="${record.id}" data-field="consignmentId" value="${escapeHtml(record.consignmentId)}" placeholder="${getPlaceholder(activeCourier)}" class="w-full border rounded px-3 py-2 focus:ring-2 focus:outline-none ${record.errors?.consignmentId ? 'border-red-400 focus:ring-red-500' : 'border-slate-300 focus:ring-teal-500'}" />
                                        <p id="err-${record.id}-consignmentId" class="text-red-500 text-[11px] mt-1 font-medium" style="display:${record.errors?.consignmentId ? 'block' : 'none'}">${escapeHtml(record.errors?.consignmentId || '')}</p>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Arogga ID</label>
                                        <input type="text" data-action="update-record" data-id="${record.id}" data-field="aroggaId" value="${escapeHtml(record.aroggaId)}" placeholder="e.g. 4728485A" class="w-full border rounded px-3 py-2 focus:ring-2 focus:outline-none ${record.errors?.aroggaId ? 'border-red-400 focus:ring-red-500' : 'border-slate-300 focus:ring-teal-500'}" />
                                        <p id="err-${record.id}-aroggaId" class="text-red-500 text-[11px] mt-1 font-medium" style="display:${record.errors?.aroggaId ? 'block' : 'none'}">${escapeHtml(record.errors?.aroggaId || '')}</p>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">Products Returned</label>
                                    <div class="space-y-3">${productsHTML}</div>
                                    <div class="mt-2 text-right">
                                        <button data-action="add-product" data-id="${record.id}" class="text-sm font-medium text-teal-600 hover:text-teal-800 flex items-center justify-end w-full gap-1">
                                            <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add another product
                                        </button>
                                    </div>
                                </div>

                                <div class="mb-6">
                                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Video Link</label>
                                    <input type="text" data-action="update-record" data-id="${record.id}" data-field="videoLink" value="${escapeHtml(record.videoLink)}" placeholder="https://drive.google.com/..." class="w-full border rounded px-3 py-2 text-blue-600 focus:ring-2 focus:outline-none ${record.errors?.videoLink ? 'border-red-400 focus:ring-red-500' : 'border-slate-300 focus:ring-teal-500'}" />
                                    <p id="err-${record.id}-videoLink" class="text-red-500 text-[11px] mt-1 font-medium" style="display:${record.errors?.videoLink ? 'block' : 'none'}">${escapeHtml(record.errors?.videoLink || '')}</p>
                                </div>

                                <div class="flex justify-between items-center pt-3 border-t border-slate-100">
                                    <div class="flex items-center gap-2">
                                        <input type="checkbox" id="noReq-${record.id}" data-action="update-record" data-id="${record.id}" data-field="noRequired" ${record.noRequired ? 'checked' : ''} class="w-4 h-4 text-teal-600 bg-slate-100 border-slate-300 rounded focus:ring-teal-500 cursor-pointer" />
                                        <label for="noReq-${record.id}" class="text-sm font-semibold text-slate-600 cursor-pointer">No Required</label>
                                    </div>
                                    <div class="flex gap-3 items-center">
                                        ${record.confirmDelete ? `
                                            <div class="flex items-center gap-2 bg-red-50 border border-red-100 px-3 py-1.5 rounded shadow-sm">
                                                <span class="text-sm text-red-700 font-semibold mr-1">Delete this parcel?</span>
                                                <button data-action="delete-record" data-id="${record.id}" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm font-medium transition-colors">Yes</button>
                                                <button data-action="cancel-delete-record" data-id="${record.id}" class="bg-slate-200 hover:bg-slate-300 text-slate-800 px-3 py-1 rounded text-sm font-medium transition-colors">No</button>
                                            </div>
                                        ` : `
                                            <button data-action="prompt-delete-record" data-id="${record.id}" class="text-red-500 hover:bg-red-100 p-2 rounded transition-colors" title="Delete Parcel">
                                                <i data-lucide="trash-2" class="w-5 h-5"></i>
                                            </button>
                                        `}
                                        <button data-action="save-record" data-id="${record.id}" class="bg-slate-800 hover:bg-slate-900 text-white px-6 py-2 rounded shadow flex items-center gap-2 transition-colors font-medium">
                                            <i data-lucide="save" class="w-4 h-4"></i> Save
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (record.mode === 'view') {
                    const formattedProductsJSX = record.products.map((p, idx) => `
                        <span>
                            ${escapeHtml(p.name)} [${escapeHtml(formatQuantity(p.qty))}] <span class="font-bold">${escapeHtml(p.status || 'N/A')}</span>
                            ${idx < record.products.length - 1 ? '<span class="font-bold mx-1">|</span>' : ''}
                        </span>
                    `).join('');

                    return `
                        <div class="relative mb-6">
                            <div class="bg-white border-l-4 border-l-blue-500 border-t border-r border-b border-slate-200 rounded-r-lg p-5 shadow-sm">
                                <div class="font-mono text-[15px] leading-loose text-slate-800 break-words">
                                    <div><span class="font-semibold">Consignment ID :</span> &nbsp;<span class="font-bold">${escapeHtml(record.consignmentId)}</span></div>
                                    <div><span class="font-semibold">Arogga ID :</span> &nbsp;<span class="font-bold">${escapeHtml(record.aroggaId)}</span></div>
                                    <div><span class="font-semibold">Returned For :</span> &nbsp;${formattedProductsJSX}</div>
                                    <div><span class="font-semibold">Video:</span> &nbsp;<a href="${escapeHtml(record.videoLink)}" target="_blank" rel="noreferrer" class="text-blue-600 hover:text-blue-800 underline">${escapeHtml(record.videoLink)}</a></div>
                                </div>
                                <div class="mt-5 pt-4 border-t border-slate-100 flex justify-end">
                                    <button data-action="edit-record" data-id="${record.id}" class="text-amber-600 bg-amber-50 hover:bg-amber-100 px-6 py-2 rounded font-medium transition-colors flex items-center gap-2 shadow-sm border border-amber-100">
                                        <i data-lucide="edit-2" class="w-4 h-4"></i> Edit
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }).join('');

            return `
                <div class="min-h-screen bg-slate-100 p-4 md:p-8 font-sans text-slate-800">
                    
                    ${showDeleteAllConfirm ? `
                        <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6">
                                <div class="flex items-center gap-3 text-red-600 mb-4">
                                    <i data-lucide="trash-2" class="w-7 h-7"></i>
                                    <h3 class="text-xl font-bold">Delete All Records?</h3>
                                </div>
                                <p class="text-slate-600 mb-6">
                                    Are you sure you want to permanently delete all <strong>${records.length}</strong> parcel records for ${activeCourier}? This action cannot be undone.
                                </p>
                                <div class="flex justify-end gap-3">
                                    <button data-action="cancel-delete-all" class="px-5 py-2.5 text-slate-700 hover:bg-slate-100 rounded-lg font-semibold transition-colors">Cancel</button>
                                    <button data-action="confirm-delete-all" class="px-5 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-lg font-semibold shadow-md transition-colors">Yes, Delete All</button>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-xl overflow-hidden">
                        
                        <!-- TOP BAR -->
                        <div class="bg-slate-900 text-white p-4 flex flex-col lg:flex-row justify-between items-center gap-4">
                            <div class="flex items-center w-full lg:w-auto">
                                <button data-action="back-home" class="p-2 hover:bg-slate-700 rounded-full transition-colors mr-3" title="Back to Home">
                                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                                </button>
                                <h2 class="text-xl font-bold tracking-wider">${activeCourier}</h2>
                            </div>

                            <div class="w-full lg:w-auto flex justify-center">
                                <input type="date" data-action="update-date" value="${date}" class="bg-slate-800 text-white border border-slate-700 rounded px-4 py-2 focus:outline-none focus:border-teal-500 w-full max-w-[200px]" />
                            </div>

                            <div class="w-full lg:w-auto flex flex-col sm:flex-row justify-end items-center gap-4">
                                <!-- COUNTERS -->
                                <div class="flex items-center gap-3 font-mono text-sm bg-slate-800 px-3 py-2 rounded border border-slate-700 whitespace-nowrap">
                                    <span title="Total Parcel" class="font-semibold text-white"><span class="text-teal-400">TP:</span> <span class="counter-tp">${totalParcels}</span></span>
                                    <span class="text-slate-600">|</span>
                                    <span title="Product Count" class="font-semibold text-white"><span class="text-blue-400">PC:</span> <span class="counter-pc">${productCount}</span></span>
                                    <span class="text-slate-600">|</span>
                                    <span title="Damaged Count" class="font-semibold text-white"><span class="text-amber-400">DC:</span> <span class="counter-dc">${damagedCount}</span></span>
                                    <span class="text-slate-600">|</span>
                                    <span title="Lost Count" class="font-semibold text-white"><span class="text-red-400">LC:</span> <span class="counter-lc">${lostCount}</span></span>
                                </div>

                                <!-- ACTION BUTTONS -->
                                <div class="flex items-center gap-2">
                                    <button data-action="export-docx" ${!hasSavedRecords ? 'disabled' : ''} class="export-btn bg-teal-600 hover:bg-teal-500 disabled:bg-slate-700 disabled:text-slate-400 text-white px-4 py-2 rounded shadow flex items-center gap-2 transition-colors font-medium text-sm md:text-base">
                                        <i data-lucide="download" class="w-4 h-4"></i> Export Docx
                                    </button>
                                    <button data-action="show-delete-all" ${records.length === 0 ? 'disabled' : ''} class="delete-all-btn bg-red-600 hover:bg-red-500 disabled:bg-slate-700 disabled:text-slate-400 text-white px-4 py-2 rounded shadow flex items-center gap-2 transition-colors font-medium text-sm md:text-base">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i> Delete All
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- WORKSPACE -->
                        <div class="p-6 bg-slate-50 min-h-[500px]">
                            ${records.length === 0 ? noRecordsHTML : recordsHTML}

                            <div class="mt-6 flex justify-center">
                                <button data-action="add-record" class="border-2 border-dashed border-teal-300 hover:border-teal-500 hover:bg-teal-50 text-teal-700 w-full py-4 rounded-lg flex items-center justify-center gap-2 font-semibold transition-all duration-200">
                                    <i data-lucide="plus" class="w-5 h-5"></i> Add another parcel.
                                </button>
                            </div>
                        </div>

                        <!-- BOTTOM ACTION BAR -->
                        <div class="bg-white border-t border-slate-200 p-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div class="flex flex-wrap gap-x-6 gap-y-2 text-sm text-slate-600 font-medium w-full sm:w-auto justify-center sm:justify-start">
                                <span>Total Parcel: <span class="text-slate-900 font-bold counter-tp">${totalParcels}</span></span>
                                <span>Product Count: <span class="text-slate-900 font-bold counter-pc">${productCount}</span></span>
                                <span>Damaged Count: <span class="text-slate-900 font-bold counter-dc">${damagedCount}</span></span>
                                <span>Lost Count: <span class="text-slate-900 font-bold counter-lc">${lostCount}</span></span>
                            </div>
                            <div class="flex items-center gap-3 w-full sm:w-auto justify-center sm:justify-end">
                                <button data-action="export-docx" ${!hasSavedRecords ? 'disabled' : ''} class="export-btn bg-slate-900 hover:bg-slate-800 disabled:bg-slate-300 disabled:text-slate-500 text-white px-4 md:px-6 py-2.5 rounded shadow-lg flex items-center gap-2 transition-colors font-bold tracking-wide text-sm md:text-base">
                                    <i data-lucide="download" class="w-5 h-5"></i> Export Final Docx
                                </button>
                                <button data-action="show-delete-all" ${records.length === 0 ? 'disabled' : ''} class="delete-all-btn bg-red-600 hover:bg-red-700 disabled:bg-slate-300 disabled:text-slate-500 text-white px-4 md:px-6 py-2.5 rounded shadow-lg flex items-center gap-2 transition-colors font-bold tracking-wide text-sm md:text-base">
                                    <i data-lucide="trash-2" class="w-5 h-5"></i> Delete All
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            `;
        };

        const render = () => {
            const root = document.getElementById('root');
            if (!activeCourier) {
                root.innerHTML = renderHome();
            } else {
                root.innerHTML = renderWorkspace();
            }
            // Re-initialize icons after rendering new DOM
            if (window.lucide) {
                window.lucide.createIcons();
            }
        };

        // Initial Render
        render();

    </script>
</body>
</html>
